name: Publish Stable Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact validated main SHA to publish
        required: true
        type: string
      visual_receipt_sha256:
        description: Digest of the exact-SHA agent visual review receipt
        required: true
        type: string

permissions:
  actions: read
  contents: write
  statuses: read

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ inputs.target_sha }}
      VISUAL_RECEIPT_SHA256: ${{ inputs.visual_receipt_sha256 }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Require current main and dev exact SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VISUAL_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          main_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          dev_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          [[ "$TARGET_SHA" == "$main_sha" && "$TARGET_SHA" == "$dev_sha" ]] || {
            echo "Target, main, and dev must identify the same commit." >&2
            exit 1
          }

      - name: Require successful exact-SHA workflows and download packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/incoming"
          workflows=(fast-checks.yml android-release.yml linux-desktop.yml windows-desktop.yml macos-desktop.yml)
          artifacts=("" vpn-control-android-release-apk vpn-control-linux-packages vpn-control-windows-installers vpn-control-macos-package)
          for index in "${!workflows[@]}"; do
            workflow=${workflows[$index]}
            run_id=$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?event=push&status=completed&per_page=100" \
              --jq ".workflow_runs | map(select(.head_sha == \"$TARGET_SHA\" and .conclusion == \"success\")) | sort_by(.id) | last | .id")
            [[ -n "$run_id" && "$run_id" != "null" ]] || { echo "Missing exact-SHA success for $workflow" >&2; exit 1; }
            artifact=${artifacts[$index]}
            if [[ -n "$artifact" ]]; then
              gh run download "$run_id" --repo "$REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/incoming/$artifact"
            fi
          done
          integration_id=$(gh api "repos/$REPOSITORY/actions/workflows/vpn-integration.yml/runs?event=workflow_dispatch&status=completed&per_page=100" \
            --jq ".workflow_runs | map(select(.head_sha == \"$TARGET_SHA\" and .conclusion == \"success\" and (.display_title | contains(\"VPN Integration / all /\")))) | sort_by(.id) | last | .id")
          [[ -n "$integration_id" && "$integration_id" != "null" ]] || {
            echo "Missing exhaustive exact-SHA VPN Integration success." >&2
            exit 1
          }
          visual_status=$(gh api "repos/$REPOSITORY/commits/$TARGET_SHA/statuses" \
            --jq 'map(select(.context == "vpn-control/agent-visual")) | sort_by(.id) | last | [.state, .description] | @tsv')
          IFS=$'\t' read -r visual_state visual_description <<< "$visual_status"
          receipt_prefix=${VISUAL_RECEIPT_SHA256:0:16}
          [[ "$visual_state" == "success" && "$visual_description" == *"$receipt_prefix"* ]] || {
            echo "Missing exact-SHA agent visual review status for receipt $receipt_prefix." >&2
            exit 1
          }

      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate and assemble release
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check_release_metadata.py --require-release-ready
          version=$(python3 scripts/version_metadata.py --field version)
          build_number=$(python3 scripts/version_metadata.py --field build-number)
          tag=$(python3 scripts/version_metadata.py --field tag)
          mac_arch=$(cat "$RUNNER_TEMP/incoming/vpn-control-macos-package/ARCHITECTURE.txt")
          python3 scripts/assemble_update_release.py \
            --incoming "$RUNNER_TEMP/incoming" \
            --output release \
            --build-number "$build_number" \
            --version "$version" \
            --tag "$tag" \
            --mac-architecture "$mac_arch"
          python3 scripts/release_notes.py --version "$version" > release-notes.md
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$tag" release/* \
            --repo "$REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "VPN Control $version" \
            --notes-file release-notes.md \
            --latest
