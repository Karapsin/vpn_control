name: Gradle Cache Warm

# The only writer of the hosted Gradle caches. GitHub shares a cache only with
# its own branch and with runs on other branches when it was written on the
# default branch (main). This workflow therefore runs on the main ref (its
# schedule always does; dispatch it with --ref main), checks out a dev commit,
# never main's tree, and saves the setup-gradle cache (Gradle User Home with the
# local build cache) per runner OS. Every other workflow is cache-read-only;
# setup-gradle restores by OS prefix, so ci/* and dev runs read these entries.
# Release-ready sources build without task-output reuse (scripts/gradle_ci_cache.py).
on:
  workflow_dispatch:
    inputs:
      dev_sha:
        description: "dev commit to build (full SHA; default: current origin/dev)"
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: gradle-cache-warm
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve dev commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout dev history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0

      - name: Require the default branch and a dev commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.dev_sha }}
        run: python3 scripts/gradle_cache_warm_source.py

  warm:
    name: Warm ${{ matrix.os }} Gradle cache
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      # One fresh entry per warm run; consumers restore the newest entry for their OS.
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_EXECUTION: ${{ needs.resolve.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout dev commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android native build tools
        if: runner.os == 'Linux'
        run: bash scripts/prepare_android_native_tools.sh

      - name: Read native helper SDK version
        if: runner.os == 'Windows'
        id: native-helper-sdk
        shell: pwsh
        run: |
          $Pin = Get-Content desktopApp/native/windows/toolchain.lock.json -Raw | ConvertFrom-Json
          "version=$($Pin.sdkVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up native helper SDK
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ steps.native-helper-sdk.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: false

      - name: Set up Gradle build cache
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/gradle_ci_cache.py

      - name: Build the CI Gradle tasks
        shell: bash
        env:
          GRADLE_OPTS: ${{ env.GRADLE_BUILD_CACHE_OPTS }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/gradle_cache_warm.py
