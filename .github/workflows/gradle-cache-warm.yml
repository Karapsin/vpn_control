name: Gradle Cache Warm

# The only writer of the hosted Gradle caches. GitHub shares a cache only with
# its own branch and with runs on other branches when it was written on the
# default branch (main). This workflow therefore runs on the main ref (its
# schedule always does; dispatch it with --ref main), checks out a dev commit,
# never main's tree, and saves the setup-gradle cache (Gradle User Home with the
# local build cache) per runner OS. Every other workflow is cache-read-only;
# setup-gradle restores by OS prefix, so ci/* and dev runs read these entries.
# Release-ready sources build without task-output reuse (scripts/gradle_ci_cache.py).
#
# Dispatch and schedule always run main's copy of this file, which changes only
# at a release, while it builds a newer dev commit. So it must not depend on dev
# helper names: the commit resolution below is inline, and the only repository
# paths it uses are the stable interface STABLE_WARM_INTERFACE in
# scripts/test_gradle_ci_cache.py (the no-argument entry point
# scripts/gradle_cache_warm.py and the Windows SDK pin). Renaming either on dev
# breaks every warm until the next release; the test refuses it.
on:
  workflow_dispatch:
    inputs:
      dev_sha:
        description: "dev commit to build (full SHA; default: current origin/dev)"
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: gradle-cache-warm
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve dev commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout dev history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0

      # Inline on purpose: no dev script runs before the commit is chosen.
      - name: Require the default branch and a dev commit
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.dev_sha }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          [[ -n "$default_branch" ]] || { echo "Could not read the repository default branch." >&2; exit 1; }
          if [[ "$GITHUB_REF" != "refs/heads/$default_branch" ]]; then
            echo "Gradle Cache Warm writes the shared cache only from refs/heads/$default_branch; this run is on '$GITHUB_REF'." >&2
            exit 1
          fi
          sha=$(printf '%s' "${REQUESTED_SHA:-}" | tr -d '[:space:]' | tr 'A-F' 'a-f')
          [[ -n "$sha" ]] || sha=$(git rev-parse HEAD)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "dev_sha must be a full 40-character commit SHA: '$sha'" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$sha" HEAD || { echo "$sha is not contained in dev." >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "[vpn-control] Gradle cache warm {\"sha\": \"$sha\"}"

  warm:
    name: Warm ${{ matrix.os }} Gradle cache
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      # One fresh entry per warm run; consumers restore the newest entry for their OS.
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_EXECUTION: ${{ needs.resolve.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout dev commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Read native helper SDK version
        if: runner.os == 'Windows'
        id: native-helper-sdk
        shell: pwsh
        run: |
          $Pin = Get-Content desktopApp/native/windows/toolchain.lock.json -Raw | ConvertFrom-Json
          "version=$($Pin.sdkVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up native helper SDK
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ steps.native-helper-sdk.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: false

      # The stable entry point installs the Android native tools on Linux and applies
      # the build-cache policy itself, so dev may rename those helpers freely.
      - name: Build the CI Gradle tasks
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/gradle_cache_warm.py
