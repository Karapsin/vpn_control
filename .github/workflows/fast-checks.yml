name: Fast Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    paths:
      - ".github/workflows/fast-checks.yml"
      - "AGENTS.md"
      - "README.md"
      - "protocol_smoke_checklist.md"
      - "docs/**"
      - "app/**"
      - "desktopApp/**"
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "scripts/add_language.py"
      - "scripts/check_localization.py"
      - "scripts/status_catalog_tool.py"
      - "scripts/check_release_hygiene.sh"
      - "scripts/check_docs_hygiene.sh"
      - "scripts/arch_install.sh"
      - "scripts/test_arch_install_hygiene.sh"

jobs:
  fast-checks:
    name: Hygiene, Localization, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release hygiene
        run: ./scripts/check_release_hygiene.sh

      - name: Check whitespace
        run: |
          if git grep -nI -E '[[:blank:]]$' -- \
            ':!*.png' \
            ':!*.jpg' \
            ':!*.jpeg' \
            ':!*.webp' \
            ':!*.ico' \
            ':!*.aar' \
            ':!*.so' \
            ':!*.exe' \
            ':!*.msi' \
            ':!*.dmg'; then
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check localization catalogs
        run: ./scripts/check_localization.py

      - name: Check typed status catalogs
        run: ./scripts/status_catalog_tool.py check

      - name: Run fast unit tests
        run: ./gradlew :shared:model:desktopTest :shared:core:desktopTest :shared:ui:desktopTest :desktopApp:test :app:testDebugUnitTest
