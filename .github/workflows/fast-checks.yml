name: Fast Checks

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - ".github/workflows/fast-checks.yml"
      - ".github/required-workflows.json"
      - ".codex/config.toml"
      - "AGENTS.md"
      - "README.md"
      - "agent_docs/**"
      - "agent_tools/**"
      - "docs/**"
      - "app/**"
      - "desktopApp/**"
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "scripts/add_language.py"
      - "scripts/check_localization.py"
      - "scripts/status_catalog_tool.py"
      - "scripts/check_release_hygiene.sh"
      - "scripts/check_docs_hygiene.sh"
      - "scripts/check_contract_docs.py"
      - "scripts/check_user_facing_terminology.py"
      - "scripts/check_ui_theme.py"
      - "scripts/visual_regression.py"
      - "scripts/test_visual_regression.py"
      - "scripts/test_visual_platform.py"
      - "scripts/test_visual_review.py"
      - "scripts/visual_platform.py"
      - "scripts/visual_review.py"
      - "scripts/bootstrap_windows_visual_vm.sh"
      - "scripts/start_windows_visual_vm.sh"
      - "scripts/mark_windows_visual_vm_ready.sh"
      - "scripts/capture_visual_android.sh"
      - "scripts/capture_visual_desktop.sh"
      - "scripts/capture_visual_desktop.ps1"
      - "scripts/capture_visual_windows_qemu.py"
      - "scripts/select_visual_scenes.py"
      - "visual-tests/**"
      - "scripts/check_release_metadata.py"
      - "scripts/release_notes.py"
      - "scripts/version_metadata.py"
      - "scripts/test_version_metadata.py"
      - "scripts/test_vpn_integration_fixture.py"
      - "scripts/test_user_facing_terminology.py"
      - "scripts/integration/**"
      - "scripts/arch_install.sh"
      - "scripts/test_arch_install_hygiene.sh"

jobs:
  fast-checks:
    name: Hygiene, Localization, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release hygiene
        run: ./scripts/check_release_hygiene.sh

      - name: Check documentation hygiene
        run: ./scripts/check_docs_hygiene.sh

      - name: Check whitespace
        run: |
          if git grep -nI -E '[[:blank:]]$' -- \
            ':!*.png' \
            ':!*.jpg' \
            ':!*.jpeg' \
            ':!*.webp' \
            ':!*.ico' \
            ':!*.aar' \
            ':!*.so' \
            ':!*.exe' \
            ':!*.msi' \
            ':!*.dmg'; then
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent tool dependencies
        run: python -m pip install --disable-pip-version-check -r agent_tools/requirements-mcp.txt

      - name: Test agent tools
        run: python -m unittest discover -s agent_tools/tests

      - name: Check fixed UI theme and visual comparator
        run: |
          python scripts/check_ui_theme.py
          python scripts/test_visual_regression.py
          python scripts/test_visual_platform.py
          python scripts/test_visual_review.py
          python scripts/select_visual_scenes.py --manifest visual-tests/scenes.json --platform linux --kind app >/dev/null
          bash -n scripts/bootstrap_windows_visual_vm.sh
          bash -n scripts/start_windows_visual_vm.sh
          bash -n scripts/mark_windows_visual_vm_ready.sh
          bash -n scripts/capture_visual_android.sh
          bash -n scripts/capture_visual_desktop.sh
          python -m py_compile scripts/capture_visual_macos_tart.py scripts/capture_visual_windows_qemu.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check localization catalogs
        run: ./scripts/check_localization.py

      - name: Check typed status catalogs
        run: ./scripts/status_catalog_tool.py check

      - name: Run fast unit tests
        run: ./gradlew :shared:model:desktopTest :shared:core:desktopTest :shared:ui:desktopTest :desktopApp:test :app:testDebugUnitTest :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin
