name: Linux Desktop Package

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - ".github/workflows/linux-desktop.yml"
      - "desktopApp/**"
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "scripts/prepare_sing_box_desktop_runtime.sh"
      - "scripts/check_release_hygiene.sh"
      - "scripts/version_metadata.py"
      - "scripts/check_release_metadata.py"
      - "scripts/test_vpn_integration_fixture.py"
      - "scripts/run_desktop_vpn_integration.py"
      - "scripts/integration/**"
      - "scripts/package_linux_desktop.sh"
      - "scripts/test_linux_desktop_package.sh"
      - "scripts/test_packaged_cli.py"
      - "scripts/test_packaged_cli_harness.py"
      - "scripts/package_arch_desktop_update.sh"
      - "scripts/install_arch_desktop_update.sh"
      - "scripts/test_arch_desktop_update.sh"

jobs:
  package-linux-desktop:
    name: Build DEB and RPM
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release hygiene
        run: ./scripts/check_release_hygiene.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm cpio

      - name: Build Linux packages
        # Package validation invokes the disconnected public-launcher CLI smoke.
        run: ./scripts/package_linux_desktop.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: vpn-control-linux-packages
          path: |
            desktopApp/build/compose/binaries/main/**/*.deb
            desktopApp/build/compose/binaries/main/**/*.rpm
            dist/arch/*.tar.gz
            dist/arch/SHA256SUMS.txt
          if-no-files-found: error
