name: Environment Canary

# Weekly early warning for hosted-runner image drift. Every other workflow pins
# its runner image, so this is the only place that follows the moving `-latest`
# labels. It is advisory: it is not in .github/required-workflows.json and a
# failure here must never block a push or a release.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Fast checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install agent tool dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r agent_tools/requirements-mcp.txt

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Check environment pins
        if: ${{ !cancelled() }}
        run: python -m unittest agent_tools.tests.test_ci_environment_pins

      - name: Check whitespace
        if: ${{ !cancelled() }}
        run: python scripts/check_source_whitespace.py

      - name: Set up Gradle
        if: ${{ !cancelled() }}
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true

      - name: Run shared unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew --continue :shared:model:desktopTest :shared:core:desktopTest :shared:ui:desktopTest
