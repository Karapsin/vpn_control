name: Windows Update Fixture Pair

on:
  workflow_call:
    inputs:
      base_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows-update-fixture:
    if: github.ref == 'refs/heads/dev'
    name: Build immutable MSI pair
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BASE_VERSION: ${{ inputs.base_version }}
      FIXTURE_ROOT: ${{ runner.temp }}\vpn-control-windows-update-fixture

    steps:
      - name: Checkout selected development source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read native helper SDK version
        id: native-helper-sdk
        shell: pwsh
        run: |
          $Pin = Get-Content desktopApp/native/windows/toolchain.lock.json -Raw | ConvertFrom-Json
          "version=$($Pin.sdkVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up native helper SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.native-helper-sdk.outputs.version }}

      - name: Check release hygiene
        shell: bash
        run: ./scripts/check_release_hygiene.sh

      - name: Verify Windows admission diagnostic behavior
        run: python scripts/test_windows_install_admission_diagnostic.py

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          $WixRoot = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $WixRoot) {
            throw "WiX Toolset installation directory was not found"
          }
          $WixBin = Join-Path $WixRoot.FullName "bin"
          if (-not (Test-Path $WixBin)) {
            throw "WiX Toolset bin directory was not found at $WixBin"
          }
          $WixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare frozen runtime and immutable fixture plan
        shell: pwsh
        run: |
          .\scripts\prepare_sing_box_desktop_runtime.ps1
          $TargetVersion = (& python scripts/version_metadata.py --field version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not read the canonical target version" }
          python scripts/prepare_desktop_update_fixture.py prepare `
            --repository $PWD `
            --output $env:FIXTURE_ROOT `
            --base-version $env:BASE_VERSION `
            --target-version $TargetVersion `
            --runtime desktopApp\src\main\resources\bin\windows-amd64\sing-box.exe `
            --platform windows `
            --architecture x86_64
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare the immutable Windows fixture" }

      - name: Build and verify immutable MSI pair
        shell: pwsh
        run: |
          python scripts/prepare_desktop_update_fixture.py build `
            --directory $env:FIXTURE_ROOT `
            --confirm-owned-native-host-build
          if ($LASTEXITCODE -ne 0) { throw "Windows fixture pair build failed" }

      - name: Upload immutable fixture pair and provenance
        uses: actions/upload-artifact@v4
        with:
          name: vpn-control-windows-update-fixture-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vpn-control-windows-update-fixture/fixture-receipt.json
            ${{ runner.temp }}/vpn-control-windows-update-fixture/snapshot.json
            ${{ runner.temp }}/vpn-control-windows-update-fixture/build-plan.json
            ${{ runner.temp }}/vpn-control-windows-update-fixture/base-build.log
            ${{ runner.temp }}/vpn-control-windows-update-fixture/target-build.log
            ${{ runner.temp }}/vpn-control-windows-update-fixture/packages/base/**
            ${{ runner.temp }}/vpn-control-windows-update-fixture/packages/target/**
          if-no-files-found: error

      - name: Preserve failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-control-windows-update-fixture-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vpn-control-windows-update-fixture/snapshot.json
            ${{ runner.temp }}/vpn-control-windows-update-fixture/build-plan.json
            ${{ runner.temp }}/vpn-control-windows-update-fixture/base-build.log
            ${{ runner.temp }}/vpn-control-windows-update-fixture/target-build.log
          if-no-files-found: warn
