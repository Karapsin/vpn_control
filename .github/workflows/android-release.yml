name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    paths:
      - ".github/workflows/android-release.yml"
      - "app/**"
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "scripts/check_release_hygiene.sh"

jobs:
  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release hygiene
        run: ./scripts/check_release_hygiene.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare stable Android signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [[ -z "${!value}" ]]; then
              echo "Required Android signing secret is missing: $value" >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/vpn-control-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            echo "VPN_CONTROL_ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "VPN_CONTROL_ANDROID_STORE_PASSWORD=$STORE_PASSWORD"
            echo "VPN_CONTROL_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "VPN_CONTROL_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "VPN_CONTROL_ANDROID_CERT_SHA256=$CERT_SHA256"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify stable APK signer
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          actual=$($apksigner verify --print-certs "$apk_path" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$VPN_CONTROL_ANDROID_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ -n "$actual" && "$actual" == "$expected" ]] || {
            echo "Release APK signer does not match ANDROID_SIGNING_CERT_SHA256" >&2
            exit 1
          }

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-control-android-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
