version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/agent_tools"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
