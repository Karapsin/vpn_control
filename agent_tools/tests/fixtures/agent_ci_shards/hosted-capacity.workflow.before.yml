jobs:
  fast-checks:
    name: Hygiene, Localization, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent tool dependencies
        run: python -m pip install --disable-pip-version-check -r agent_tools/requirements-mcp.txt

      - name: Check release hygiene
        run: ./scripts/check_release_hygiene.sh

      - name: Check documentation hygiene
        if: ${{ !cancelled() }}
        run: ./scripts/check_docs_hygiene.sh

      - name: Check whitespace
        if: ${{ !cancelled() }}
        run: python3 scripts/check_source_whitespace.py

      - name: Install qemu-img for agent fixtures
        if: ${{ !cancelled() }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils

      - name: Test real Linux TPM ownership census
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          sudo -- "$pythonLocation/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import unittest
          if os.geteuid() != 0:
              raise SystemExit('Linux native census requires root')
          caps = int(next(line.split()[1] for line in Path('/proc/self/status').read_text().splitlines() if line.startswith('CapEff:')), 16)
          if not caps & (1 << 19):
              raise SystemExit('Linux native census requires CAP_SYS_PTRACE')
          suite = unittest.defaultTestLoader.loadTestsFromName('agent_tools.tests.test_windows_tpm_owner.LinuxKernelCausalTests.test_whole_before_unrelated_nondumpable_red_privileged_full_generated_observer_green')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 1 or result.skipped or not result.wasSuccessful():
              raise SystemExit('Linux native census must run once without skips')
          PY

      - name: Test real Linux creator pre-VM root census
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          sudo -- "$pythonLocation/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import unittest
          if os.geteuid() != 0:
              raise SystemExit('Linux native creator census requires root')
          caps = int(next(line.split()[1] for line in Path('/proc/self/status').read_text().splitlines() if line.startswith('CapEff:')), 16)
          if not caps & (1 << 19):
              raise SystemExit('Linux native creator census requires CAP_SYS_PTRACE')
          suite = unittest.defaultTestLoader.loadTestsFromName('agent_tools.tests.test_windows_creator_prevm_refusal_recovery.LinuxRootCensusCausalTests.test_whole_before_ordinary_scan_red_generated_root_census_green')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 1 or result.skipped or not result.wasSuccessful():
              raise SystemExit('Linux native creator root census must run once without skips')
          PY

      - name: Test affected agent tools
        if: ${{ !cancelled() }}
        timeout-minutes: 50
        env:
          AGENT_TEST_BASELINE: ${{ github.event_name == 'workflow_dispatch' && (inputs.baseline || github.sha) || '' }}
          AUDIT_AGENT_TESTS: ${{ inputs.audit_agent_tests && '1' || '' }}
        run: |
          if [[ "$AUDIT_AGENT_TESTS" == "1" ]]; then
            python agent_tools/affected_agent_tests.py --baseline "$AGENT_TEST_BASELINE" --audit --run --shard-index 0 --shard-count 2 --ci-evidence-dir .rag_index/agent-ci-evidence-0
          else
            python agent_tools/affected_agent_tests.py --run --shard-index 0 --shard-count 2 --ci-evidence-dir .rag_index/agent-ci-evidence-0
          fi

      - name: Retain public agent shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-shard-${{ github.run_id }}-${{ github.run_attempt }}-0
          path: |
            .rag_index/agent-ci-evidence-0/plan.json
            .rag_index/agent-ci-evidence-0/events.jsonl
            .rag_index/agent-ci-evidence-0/summary.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Check fixed UI theme and visual comparator
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_ui_theme.py
          python scripts/test_visual_regression.py
          python scripts/test_visual_platform.py
          python scripts/test_visual_review.py
          python scripts/select_visual_scenes.py --manifest visual-tests/scenes.json --platform linux --kind app >/dev/null
          bash -n scripts/bootstrap_windows_visual_vm.sh
          bash -n scripts/start_windows_visual_vm.sh
          bash -n scripts/mark_windows_visual_vm_ready.sh
          bash -n scripts/capture_visual_android.sh
          bash -n scripts/capture_visual_desktop.sh
          python -m py_compile scripts/capture_visual_macos_tart.py scripts/capture_visual_windows_qemu.py

      - name: Set up JDK 17
        if: ${{ !cancelled() }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android native build tools
        if: ${{ !cancelled() }}
        run: bash scripts/prepare_android_native_tools.sh

      - name: Verify Windows admission diagnostic behavior
        if: ${{ !cancelled() }}
        run: python scripts/test_windows_install_admission_diagnostic.py

      - name: Verify Windows PowerShell command bounds
        if: ${{ !cancelled() }}
        run: python scripts/test_windows_qga_powershell_size.py

      - name: Set up Gradle
        if: ${{ !cancelled() }}
        uses: gradle/actions/setup-gradle@v4

      - name: Check localization catalogs
        if: ${{ !cancelled() }}
        run: ./scripts/check_localization.py

      - name: Check typed status catalogs
        if: ${{ !cancelled() }}
        run: ./scripts/status_catalog_tool.py check

      - name: Install windowless desktop test display
        if: ${{ !cancelled() }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Run fast unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew --continue :shared:model:desktopTest :shared:core:desktopTest :shared:ui:desktopTest :desktopApp:test :app:testDebugUnitTest :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:verifyDebugAndroidTestSignatures

      - name: Verify desktop build without Android SDK
        if: ${{ !cancelled() }}
        run: python scripts/test_desktop_sdk_independence.py

      - name: Verify Windows packaging task graph
        if: ${{ !cancelled() }}
        run: python scripts/test_windows_packaging_graph.py

      - name: Verify Android instrumentation signature guard
        if: ${{ !cancelled() }}
        run: python scripts/test_android_instrumentation_signatures.py

  agent-tests-shard-1:
    name: Agent Tools Shard 2
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent tool dependencies
        run: python -m pip install --disable-pip-version-check -r agent_tools/requirements-mcp.txt

      - name: Install qemu-img for agent fixtures
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils

      - name: Test affected agent tools
        timeout-minutes: 50
        env:
          AGENT_TEST_BASELINE: ${{ github.event_name == 'workflow_dispatch' && (inputs.baseline || github.sha) || '' }}
          AUDIT_AGENT_TESTS: ${{ inputs.audit_agent_tests && '1' || '' }}
        run: |
          if [[ "$AUDIT_AGENT_TESTS" == "1" ]]; then
            python agent_tools/affected_agent_tests.py --baseline "$AGENT_TEST_BASELINE" --audit --run --shard-index 1 --shard-count 2 --ci-evidence-dir .rag_index/agent-ci-evidence-1
          else
            python agent_tools/affected_agent_tests.py --run --shard-index 1 --shard-count 2 --ci-evidence-dir .rag_index/agent-ci-evidence-1
          fi

      - name: Retain public agent shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-shard-${{ github.run_id }}-${{ github.run_attempt }}-1
          path: |
            .rag_index/agent-ci-evidence-1/plan.json
            .rag_index/agent-ci-evidence-1/events.jsonl
            .rag_index/agent-ci-evidence-1/summary.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  agent-test-coverage:
    name: Verify Agent Shard Coverage
    if: always()
    needs: [fast-checks, agent-tests-shard-1]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch first current-attempt public receipt
        uses: actions/download-artifact@v4
        with:
          name: agent-test-shard-${{ github.run_id }}-${{ github.run_attempt }}-0
          path: .rag_index/agent-ci-evidence-0

      - name: Fetch second current-attempt public receipt
        uses: actions/download-artifact@v4
        with:
          name: agent-test-shard-${{ github.run_id }}-${{ github.run_attempt }}-1
          path: .rag_index/agent-ci-evidence-1

      - name: Require actual complete disjoint shard coverage
        env:
          FIRST_SHARD_RESULT: ${{ needs.fast-checks.result }}
          SECOND_SHARD_RESULT: ${{ needs.agent-tests-shard-1.result }}
        run: python agent_tools/agent_ci_evidence.py --verify .rag_index/agent-ci-evidence-0 .rag_index/agent-ci-evidence-1 --parent-results "$FIRST_SHARD_RESULT" "$SECOND_SHARD_RESULT" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --head "${{ github.sha }}"
