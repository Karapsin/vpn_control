name: Fast Checks

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Commit to compare for affected agent tests (manual dispatch defaults to current SHA)"
        required: false
        type: string
      audit_agent_tests:
        description: Explicitly audit the complete agent test suite
        required: false
        default: false
        type: boolean
  push:
    branches:
      - dev
  pull_request:
    paths:
      - ".github/workflows/fast-checks.yml"
